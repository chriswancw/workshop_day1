name: Build bundle

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# No push trigger: this workflow only exists on main, so pushes to component
# branches cannot start it.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Configure release identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high
      - name: Test backend
        run: bun test backend
      - name: Test frontend
        run: npm test --prefix frontend -- --watch=false --browsers=ChromeHeadless
      - name: Test CLI
        run: npm test --prefix cli
      - name: Generate and push bundle
        run: node scripts/build-bundle.mjs --push
